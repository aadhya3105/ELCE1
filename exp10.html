<!DOCTYPE html>
<html>
<head>
    <title>ShopEase</title>

    <style>
        
        .block-element {
            display: block;
        }

       
        .inline-element {
            display: inline;
        }

       
        .inline-block-element {
            display: inline-block;
        }

        .float-left {
            float: left;
        }
        .clear-both {
            clear: both;
        }

        .navbar {
            background: #111;
            color: #fff;
            padding: 15px 30px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .nav-links {
            display: flex;        
            gap: 30px;
        }

        .right-links {
            display: flex;
            gap: 20px;
        }

       
        @media only screen and (max-width: 600px) {
           
            .nav-links,
            .right-links {
                display: none !important;
            }

          
            .navbar {
                justify-content: center;
            }
        }
    </style>
</head>

<body style="margin:0; font-family:Arial, sans-serif;">

  
    <div class="navbar">
        
        
        <div style="font-size:24px; font-weight:bold;">
            ShopEase
        </div>

       
        <div class="nav-links">
            <a href="#" class="inline-element" style="color:white; text-decoration:none; font-size:16px;">Home</a>
            <a href="#" class="inline-element" style="color:white; text-decoration:none; font-size:16px;">Products</a>
            <a href="#" class="inline-element" style="color:white; text-decoration:none; font-size:16px;">Categories</a>
            <a href="#" class="inline-element" style="color:white; text-decoration:none; font-size:16px;">Deals</a>
            <a href="#" class="inline-element" style="color:white; text-decoration:none; font-size:16px;">Contact</a>
        </div>

     
        <div class="right-links">
            <a href="#" class="inline-element" style="color:white; text-decoration:none; font-size:16px;">Cart 🛒</a>
            <a href="#" class="inline-element" style="color:white; text-decoration:none; font-size:16px;">Login</a>
        </div>

    </div>

    <div style="padding:40px;">
        <h2 style="margin:0;">Welcome to ShopEase!</h2>
        <p style="margin-top:5px;">
            Your one-stop destination for all shopping needs.
        </p>
    </div>

</body>
</html>
