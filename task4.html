<!DOCTYPE html>
<html>
    <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>CSS Box Model</title>
    </head>
    <style>
        body {
            background: #1f2d3d;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 40px;
            color: white;
        }

        h1 {
            margin-bottom: 40px;
            font-size: large;
        }

        .margin {
            background: #ff6f47;
            padding: 30px;
            display: inline-block;
            position: relative;

        }

        .border {
            background: #1fb7ff;
            padding: 20px;
        }

        .Padding {
            background: #ffd65c;
            padding: 30px;

        }

        .content {
            background: #15d1ac;
            width: 300px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: medium;
            color: white;
            font-weight: bold;
        }
        

        

    </style>
    <body>
        <div class="margin">
            <div class="label"><b>Margin</b></div>
            <div class="border">
                <div class="label border"><b>Border</b></div>
                <div class="Padding">
                    <div class="label padding"><b>Padding</b></div>
                    <div class="content">
                        Content
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
