<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Grid</title>

<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background:#f2f2f2;
        padding:20px;
    }

    h2{
        text-align:center;
        margin-bottom:30px;
    }

    .box{
        display:grid;
        grid-template-columns: repeat(4, 1fr); 
        gap:20px;
        max-width:1200px;
        margin:auto;
    }

    .product{
        background:white;
        padding:20px;
        text-align:center;
        border-radius:12px;
        box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .product img{
        margin-bottom:10px;
    }

    .product h3{
        margin:10px 0 5px;
    }

    .product p{
        font-size:14px;
        color:#555;
    }

    .product b{
        display:block;
        margin-top:10px;
        font-size:16px;
    }

    @media (max-width:1024px){
        .box{
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media (max-width:480px){
        .box{
            grid-template-columns: 1fr;
        }
    }

</style>
</head>

<body>

<h2>Responsive Product Grid</h2>

<div class="box">
    <div class="product">
        <img src="https://via.placeholder.com/80">
        <h3>Product 1</h3>
        <p>Good quality product</p>
        <b>₹499</b>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/80">
        <h3>Product 2</h3>
        <p>Nice and durable</p>
        <b>₹799</b>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/80">
        <h3>Product 3</h3>
        <p>Lightweight product</p>
        <b>₹1299</b>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/80">
        <h3>Product 4</h3>
        <p>Premium design</p>
        <b>₹999</b>
    </div>
</div>

</body>
</html>
