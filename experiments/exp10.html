<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopEase</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
}


.navbar{
    background:#111;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu{
    display:flex;
    gap:25px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-size:16px;
}

#menu-toggle{
    display:none;
}

.menu-button{
    display:none;
    font-size:26px;
    cursor:pointer;
}

@media (max-width:600px){

    .menu-button{
        display:block;
    }
    .menu{
        display:none;
        position:absolute;
        top:100%;
        left:0;
        width:100%;
        background:#222;
        flex-direction:column;
        align-items:center;
        padding:20px 0;
    }

    #menu-toggle:checked ~ .menu{
        display:flex;
    }
}
</style>
</head>

<body>

<div class="navbar">

    <div class="logo">ShopEase</div>
    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-button">☰</label>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Deals</a>
        <a href="#">Contact</a>
        <a href="#">Cart 🛒</a>
        <a href="#">Login</a>
    </div>

</div>

</body>
</html>
