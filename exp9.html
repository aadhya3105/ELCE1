<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>
    <style>
        @media only screen and (max-width:455px){
            .box{
                flex-direction: column;
            }
        }
    </style>
</head>

<body style="font-family:Arial;background:#f2f2f2;padding:20px;">

<h2 style="text-align:center;">Responsive Product Grid</h2>

<div class="box" style="display:flex;gap:15px;justify-content:space-between;">

    <div style="background:white;padding:15px;text-align:center;border-radius:10px;width:23%;">
        <img src="https://via.placeholder.com/80">
        <h3>Product 1</h3>
        <p>Good quality product</p>
        <b>₹499</b>
    </div>

    <div style="background:white;padding:15px;text-align:center;border-radius:10px;width:23%;">
        <img src="https://via.placeholder.com/80">
        <h3>Product 2</h3>
        <p>Nice and durable</p>
        <b>₹799</b>
    </div>

    <div style="background:white;padding:15px;text-align:center;border-radius:10px;width:23%;">
        <img src="https://via.placeholder.com/80">
        <h3>Product 3</h3>
        <p>Lightweight product</p>
        <b>₹1299</b>
    </div>

    <div style="background:white;padding:15px;text-align:center;border-radius:10px;width:23%;">
        <img src="https://via.placeholder.com/80">
        <h3>Product 4</h3>
        <p>Premium design</p>
        <b>₹999</b>
    </div>

</div>

</body>
</html>
